<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Content Command Center</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=DM+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0D0D0F;
  --surface: #18181B;
  --surface-2: #1F1F23;
  --surface-3: #27272A;
  --border: #2E2E33;
  --border-hover: #3F3F46;
  --text: #FAFAFA;
  --text-2: #A1A1AA;
  --text-3: #71717A;
  --coral: #F0714A;
  --coral-dim: rgba(240,113,74,0.15);
  --gold: #E8B931;
  --gold-dim: rgba(232,185,49,0.15);
  --teal: #2DD4BF;
  --teal-dim: rgba(45,212,191,0.15);
  --purple: #A78BFA;
  --purple-dim: rgba(167,139,250,0.15);
  --blue: #60A5FA;
  --blue-dim: rgba(96,165,250,0.15);
  --green: #4ADE80;
  --green-dim: rgba(74,222,128,0.15);
  --red: #F87171;
  --red-dim: rgba(248,113,113,0.15);
  --pink: #F472B6;
  --pink-dim: rgba(244,114,182,0.15);
}
* { margin:0; padding:0; box-sizing:border-box; }
body { background: var(--bg); color: var(--text); font-family: 'DM Sans', sans-serif; min-height:100vh; }

/* HEADER */
.header { padding: 20px 32px; display:flex; align-items:center; justify-content:space-between; border-bottom:1px solid var(--border); position:sticky; top:0; z-index:100; background: rgba(13,13,15,0.92); backdrop-filter: blur(20px); }
.header h1 { font-family:'Space Grotesk',sans-serif; font-size:20px; font-weight:700; letter-spacing:-0.5px; }
.header h1 span { color: var(--coral); }
.header-actions { display:flex; gap:8px; }
.btn { padding:8px 16px; border-radius:8px; border:1px solid var(--border); background:var(--surface); color:var(--text); font-size:13px; font-family:'DM Sans',sans-serif; cursor:pointer; transition:all .2s; display:flex; align-items:center; gap:6px; }
.btn:hover { border-color: var(--coral); background: var(--coral-dim); }
.btn-primary { background: var(--coral); border-color: var(--coral); color:#fff; font-weight:600; }
.btn-primary:hover { background: #e0603a; }

/* NAV TABS */
.nav { display:flex; gap:4px; padding:12px 32px; border-bottom:1px solid var(--border); background:var(--bg); overflow-x:auto; }
.nav-tab { padding:10px 20px; border-radius:8px; background:transparent; border:none; color:var(--text-3); font-size:14px; font-family:'DM Sans',sans-serif; cursor:pointer; transition:all .2s; white-space:nowrap; font-weight:500; }
.nav-tab:hover { color:var(--text-2); background:var(--surface); }
.nav-tab.active { color:var(--text); background:var(--surface-2); border:1px solid var(--border); }

/* MAIN */
.main { padding:24px 32px; max-width:1400px; margin:0 auto; }
.tab-content { display:none; }
.tab-content.active { display:block; }

/* ===== DASHBOARD ===== */
.stats-row { display:grid; grid-template-columns: repeat(auto-fit, minmax(180px,1fr)); gap:12px; margin-bottom:24px; }
.stat-card { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:16px 20px; }
.stat-label { font-size:12px; color:var(--text-3); text-transform:uppercase; letter-spacing:1px; margin-bottom:4px; }
.stat-value { font-family:'Space Grotesk',sans-serif; font-size:28px; font-weight:700; }
.stat-value.coral { color:var(--coral); }
.stat-value.teal { color:var(--teal); }
.stat-value.gold { color:var(--gold); }
.stat-value.purple { color:var(--purple); }
.stat-value.green { color:var(--green); }

/* ===== ALL REEL IDEAS (CONTENT LIBRARY) ===== */
.filters { display:flex; gap:8px; margin-bottom:16px; flex-wrap:wrap; align-items:center; }
.filter-chip { padding:6px 14px; border-radius:20px; border:1px solid var(--border); background:transparent; color:var(--text-3); font-size:12px; cursor:pointer; transition:all .2s; font-family:'DM Sans',sans-serif; }
.filter-chip:hover, .filter-chip.active { border-color: var(--coral); color: var(--coral); background: var(--coral-dim); }
.search-input { background:var(--surface); border:1px solid var(--border); border-radius:8px; padding:8px 14px; color:var(--text); font-size:13px; font-family:'DM Sans',sans-serif; width:240px; outline:none; }
.search-input:focus { border-color: var(--coral); }
.search-input::placeholder { color:var(--text-3); }

.reel-grid { display:grid; gap:12px; }
.reel-card { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:18px 20px; transition:all .2s; cursor:pointer; position:relative; }
.reel-card:hover { border-color: var(--border-hover); transform:translateY(-1px); }
.reel-card.expanded .reel-details { display:block; }
.reel-hook { font-size:14px; font-style:italic; color:var(--text); margin-bottom:8px; line-height:1.5; border-left:3px solid var(--coral); padding-left:12px; }
.reel-title { font-family:'Space Grotesk',sans-serif; font-size:15px; font-weight:600; margin-bottom:6px; }
.reel-meta { display:flex; gap:8px; flex-wrap:wrap; }
.reel-tag { padding:3px 10px; border-radius:12px; font-size:11px; font-weight:500; }
.tag-phase { background:var(--purple-dim); color:var(--purple); }
.tag-pillar { background:var(--teal-dim); color:var(--teal); }
.tag-length { background:var(--surface-3); color:var(--text-3); }
.tag-status { padding:3px 10px; border-radius:12px; font-size:11px; font-weight:600; }
.status-idea { background:var(--surface-3); color:var(--text-3); }
.status-filmed { background:var(--gold-dim); color:var(--gold); }
.status-edited { background:var(--blue-dim); color:var(--blue); }
.status-posted { background:var(--green-dim); color:var(--green); }
.status-reshoot { background:var(--red-dim); color:var(--red); }

.reel-details { display:none; margin-top:14px; padding-top:14px; border-top:1px solid var(--border); }
.detail-section { margin-bottom:12px; }
.detail-label { font-size:11px; text-transform:uppercase; letter-spacing:1px; color:var(--coral); margin-bottom:4px; font-weight:600; }
.detail-text { font-size:13px; color:var(--text-2); line-height:1.6; }
.detail-list { list-style:none; padding:0; }
.detail-list li { font-size:13px; color:var(--text-2); padding:2px 0; padding-left:16px; position:relative; line-height:1.5; }
.detail-list li::before { content:'•'; position:absolute; left:0; color:var(--coral); }

.reel-actions { display:flex; gap:6px; margin-top:12px; }
.reel-actions .btn { font-size:11px; padding:5px 12px; }

/* ===== VIDEO LOG ===== */
.log-table-wrap { overflow-x:auto; border:1px solid var(--border); border-radius:12px; }
table { width:100%; border-collapse:collapse; }
th { background:var(--surface-2); padding:10px 14px; text-align:left; font-size:12px; text-transform:uppercase; letter-spacing:1px; color:var(--text-3); font-weight:600; border-bottom:1px solid var(--border); white-space:nowrap; }
td { padding:10px 14px; font-size:13px; border-bottom:1px solid var(--border); color:var(--text-2); vertical-align:top; }
tr:hover td { background: var(--surface); }
td select, td input { background:var(--surface-2); border:1px solid var(--border); border-radius:6px; padding:4px 8px; color:var(--text); font-size:12px; font-family:'DM Sans',sans-serif; }
td select:focus, td input:focus { outline:none; border-color:var(--coral); }
td textarea { background:var(--surface-2); border:1px solid var(--border); border-radius:6px; padding:4px 8px; color:var(--text); font-size:12px; font-family:'DM Sans',sans-serif; width:100%; min-height:40px; resize:vertical; }

/* ===== CALENDAR ===== */
.cal-header { display:flex; align-items:center; justify-content:space-between; margin-bottom:16px; }
.cal-header h2 { font-family:'Space Grotesk',sans-serif; font-size:22px; font-weight:700; }
.cal-nav { display:flex; gap:8px; }
.cal-grid { display:grid; grid-template-columns: repeat(7,1fr); gap:4px; }
.cal-day-label { text-align:center; font-size:11px; color:var(--text-3); text-transform:uppercase; letter-spacing:1px; padding:8px 0; }
.cal-cell { min-height:100px; background:var(--surface); border:1px solid var(--border); border-radius:8px; padding:8px; cursor:pointer; transition:all .2s; position:relative; }
.cal-cell:hover { border-color: var(--border-hover); }
.cal-cell.today { border-color: var(--coral); box-shadow: 0 0 0 1px var(--coral); }
.cal-cell.other-month { opacity:0.3; }
.cal-date { font-family:'Space Grotesk',sans-serif; font-size:13px; font-weight:600; margin-bottom:4px; }
.cal-event { font-size:10px; padding:2px 6px; border-radius:4px; margin-bottom:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; cursor:pointer; }
.cal-event.shoot { background:var(--gold-dim); color:var(--gold); }
.cal-event.upload { background:var(--green-dim); color:var(--green); }
.cal-event.edit { background:var(--blue-dim); color:var(--blue); }
.cal-event.todo { background:var(--purple-dim); color:var(--purple); }
.cal-add { font-size:10px; color:var(--text-3); padding:2px 0; cursor:pointer; opacity:0; transition:all .2s; }
.cal-cell:hover .cal-add { opacity:1; }

/* ===== IDEA BANK ===== */
.idea-input-row { display:flex; gap:8px; margin-bottom:16px; }
.idea-input { flex:1; background:var(--surface); border:1px solid var(--border); border-radius:8px; padding:10px 14px; color:var(--text); font-size:14px; font-family:'DM Sans',sans-serif; outline:none; }
.idea-input:focus { border-color: var(--coral); }
.idea-select { background:var(--surface); border:1px solid var(--border); border-radius:8px; padding:10px 14px; color:var(--text); font-size:13px; font-family:'DM Sans',sans-serif; }
.idea-card { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:14px 18px; margin-bottom:8px; display:flex; justify-content:space-between; align-items:flex-start; gap:12px; transition:all .2s; }
.idea-card:hover { border-color: var(--border-hover); }
.idea-text { font-size:14px; line-height:1.5; flex:1; }
.idea-actions { display:flex; gap:4px; flex-shrink:0; }
.idea-pill { font-size:10px; padding:2px 8px; border-radius:10px; margin-top:4px; display:inline-block; }
.idea-delete { background:none; border:none; color:var(--text-3); cursor:pointer; font-size:16px; padding:2px 6px; border-radius:4px; }
.idea-delete:hover { color:var(--red); background:var(--red-dim); }
.idea-promote { background:none; border:none; color:var(--text-3); cursor:pointer; font-size:12px; padding:4px 8px; border-radius:4px; }
.idea-promote:hover { color:var(--green); background:var(--green-dim); }

/* MODAL */
.modal-overlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.7); z-index:200; justify-content:center; align-items:center; padding:20px; }
.modal-overlay.open { display:flex; }
.modal { background:var(--surface); border:1px solid var(--border); border-radius:16px; padding:24px; width:100%; max-width:500px; max-height:80vh; overflow-y:auto; }
.modal h3 { font-family:'Space Grotesk',sans-serif; font-size:18px; margin-bottom:16px; }
.modal label { display:block; font-size:12px; color:var(--text-3); text-transform:uppercase; letter-spacing:1px; margin-bottom:4px; margin-top:12px; }
.modal input, .modal select, .modal textarea { width:100%; background:var(--surface-2); border:1px solid var(--border); border-radius:8px; padding:8px 12px; color:var(--text); font-size:13px; font-family:'DM Sans',sans-serif; outline:none; }
.modal textarea { min-height:60px; resize:vertical; }
.modal input:focus, .modal select:focus, .modal textarea:focus { border-color:var(--coral); }
.modal-actions { display:flex; gap:8px; margin-top:20px; justify-content:flex-end; }

/* SCROLLBAR */
::-webkit-scrollbar { width:6px; height:6px; }
::-webkit-scrollbar-track { background:var(--bg); }
::-webkit-scrollbar-thumb { background:var(--border); border-radius:3px; }
::-webkit-scrollbar-thumb:hover { background:var(--border-hover); }

@media (max-width: 768px) {
  .main { padding:16px; }
  .header { padding:14px 16px; }
  .nav { padding:10px 16px; }
  .stats-row { grid-template-columns: repeat(2,1fr); }
  .cal-cell { min-height:60px; }
  .cal-event { font-size:8px; }
  .filters { flex-direction:column; }
  .search-input { width:100%; }
  .idea-input-row { flex-direction:column; }
}
</style>
</head>
<body>

<div class="header">
  <h1><span>●</span> Content Command Center</h1>
  <div class="header-actions">
    <button class="btn" onclick="exportData()">↓ Export Data</button>
    <button class="btn" onclick="importDataPrompt()">↑ Import Data</button>
  </div>
</div>

<div class="nav" id="nav">
  <button class="nav-tab active" data-tab="dashboard">Dashboard</button>
  <button class="nav-tab" data-tab="library">All Reel Ideas</button>
  <button class="nav-tab" data-tab="videolog">Video Log</button>
  <button class="nav-tab" data-tab="calendar">Calendar</button>
  <button class="nav-tab" data-tab="ideabank">Idea Bank</button>
</div>

<div class="main">

  <!-- DASHBOARD -->
  <div class="tab-content active" id="tab-dashboard">
    <div class="stats-row" id="statsRow"></div>
    <h3 style="font-family:'Space Grotesk'; margin:24px 0 12px; font-size:16px; color:var(--text-2);">Upcoming (Next 7 Days)</h3>
    <div id="upcomingEvents"></div>
    <h3 style="font-family:'Space Grotesk'; margin:24px 0 12px; font-size:16px; color:var(--text-2);">Recent Activity</h3>
    <div id="recentActivity"></div>
  </div>

  <!-- CONTENT LIBRARY -->
  <div class="tab-content" id="tab-library">
    <div class="filters">
      <input type="text" class="search-input" id="reelSearch" placeholder="Search reels..." oninput="renderLibrary()">
      <div id="filterChips"></div>
    </div>
    <div class="reel-grid" id="reelGrid"></div>
  </div>

  <!-- VIDEO LOG -->
  <div class="tab-content" id="tab-videolog">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;">
      <h2 style="font-family:'Space Grotesk';font-size:20px;">Footage Tracker</h2>
      <button class="btn btn-primary" onclick="addLogEntry()">+ Add Footage</button>
    </div>
    <div class="log-table-wrap">
      <table id="logTable">
        <thead><tr>
          <th>Date</th>
          <th>Description</th>
          <th>Type</th>
          <th>Status</th>
          <th>Linked Reel</th>
          <th>Notes</th>
          <th></th>
        </tr></thead>
        <tbody id="logBody"></tbody>
      </table>
    </div>
  </div>

  <!-- CALENDAR -->
  <div class="tab-content" id="tab-calendar">
    <div class="cal-header">
      <div class="cal-nav">
        <button class="btn" onclick="changeMonth(-1)">← Prev</button>
        <button class="btn" onclick="changeMonth(1)">Next →</button>
      </div>
      <h2 id="calMonth"></h2>
      <button class="btn btn-primary" onclick="openCalModal()">+ Add Event</button>
    </div>
    <div class="cal-grid" id="calGrid"></div>
  </div>

  <!-- IDEA BANK -->
  <div class="tab-content" id="tab-ideabank">
    <div class="idea-input-row">
      <input type="text" class="idea-input" id="newIdeaInput" placeholder="Drop a new reel idea here..." onkeypress="if(event.key==='Enter')addIdea()">
      <select class="idea-select" id="newIdeaCategory">
        <option value="NYC Life">NYC Life</option>
        <option value="Independence">Independence</option>
        <option value="Career">Career</option>
        <option value="Food">Food</option>
        <option value="Immigrant">Immigrant</option>
        <option value="Growth">Growth</option>
        <option value="Funny">Funny</option>
        <option value="Other">Other</option>
      </select>
      <button class="btn btn-primary" onclick="addIdea()">+ Add</button>
    </div>
    <div id="ideaList"></div>
  </div>

</div>

<!-- CALENDAR EVENT MODAL -->
<div class="modal-overlay" id="calModal">
  <div class="modal">
    <h3>Add Calendar Event</h3>
    <label>Date</label>
    <input type="date" id="calEventDate">
    <label>Title</label>
    <input type="text" id="calEventTitle" placeholder="e.g. Film park reel">
    <label>Type</label>
    <select id="calEventType">
      <option value="shoot">📹 Shoot</option>
      <option value="edit">✂️ Edit</option>
      <option value="upload">📤 Upload</option>
      <option value="todo">📋 To-Do</option>
    </select>
    <label>Notes</label>
    <textarea id="calEventNotes" placeholder="Optional notes..."></textarea>
    <div class="modal-actions">
      <button class="btn" onclick="closeCalModal()">Cancel</button>
      <button class="btn btn-primary" onclick="saveCalEvent()">Save</button>
    </div>
  </div>
</div>

<!-- LOG ENTRY MODAL -->
<div class="modal-overlay" id="logModal">
  <div class="modal">
    <h3>Add Footage Entry</h3>
    <label>Date Filmed</label>
    <input type="date" id="logDate">
    <label>Description</label>
    <input type="text" id="logDesc" placeholder="e.g. Walking shots Worcester sunset">
    <label>Type</label>
    <select id="logType">
      <option value="B-roll">B-roll</option>
      <option value="Voiceover">Voiceover</option>
      <option value="Talking-to-cam">Talking to Camera</option>
      <option value="Footage">Raw Footage</option>
      <option value="Time-lapse">Time-lapse</option>
      <option value="Audio">Audio Only</option>
    </select>
    <label>Status</label>
    <select id="logStatus">
      <option value="captured">📷 Captured</option>
      <option value="reviewed">👀 Reviewed</option>
      <option value="usable">✅ Usable</option>
      <option value="reshoot">🔄 Needs Reshoot</option>
    </select>
    <label>Linked Reel (optional)</label>
    <select id="logLinkedReel"><option value="">None</option></select>
    <label>Notes</label>
    <textarea id="logNotes" placeholder="Quality notes, lighting, what's good/bad..."></textarea>
    <div class="modal-actions">
      <button class="btn" onclick="closeLogModal()">Cancel</button>
      <button class="btn btn-primary" onclick="saveLogEntry()">Save</button>
    </div>
  </div>
</div>

<input type="file" id="importFile" style="display:none" accept=".json" onchange="importData(event)">

<script>
// ===== ALL REEL IDEAS FROM CHAT =====
const ALL_REELS = [
  // PHASE 1
  { id:'r1', title:'The Intro (Day 1 Post)', hook:'"I took a loan of 75 lakhs, moved to a country where I knew nobody, got a Master\'s degree, and now I\'m moving to New York City with no plan. Come watch me figure it out."', phase:'Phase 1', pillar:'NYC Life', length:'20-25s', structure:['Hook (text+VO) over montage: walking, coffee, laptop, campus','Quick cuts of current life — mundane, real, aesthetic not staged','End: "I don\'t know what I\'m doing. But I\'m documenting it anyway."','No CTA. No "follow for more." Just end.'], value:[], landing:null, status:'idea' },
  { id:'r2', title:'The Park Reel', hook:'"I\'ve lived in this city for almost two years and there\'s one thing I never did."', phase:'Phase 1', pillar:'Independence', length:'25-30s', structure:['Walking to the park, sitting down, opening a book','VO: kept saying "next week" for 2 years. Leaving in X days. So today I just went.','Slow shots: trees, clouds, pages, people, hands on book'], value:[], landing:'"Sometimes the smallest thing you\'ve been putting off is the thing that makes you feel the most alive."', status:'idea' },
  { id:'r3', title:'The Countdown Begins', hook:'"I never wanted to live here. And now that I\'m leaving, I\'m realizing I never actually lived here."', phase:'Phase 1', pillar:'Reflections', length:'25-30s', structure:['Walking around Worcester — campus, streets, usual spots','VO about spending 2 years but never exploring','You were so focused on leaving you forgot to be present'], value:[], landing:'"I have [X] days left. I\'m going to actually be here this time."', status:'idea' },
  { id:'r4', title:'Funny Confession (Multitasking)', hook:'"I am mass applying to jobs on my laptop while googling \'how to survive in NYC on zero income\' on my phone. Multitasking queen."', phase:'Phase 1', pillar:'Career', length:'15-20s', structure:['Quick cuts: laptop, phone, coffee getting cold, blank stare','VO: stream of consciousness — Master\'s ✓, dream city ✓, money ✗, plan ✗'], value:[], landing:'"But we move. Literally. To New York. In [X] days. With no backup plan."', status:'idea' },
  { id:'r5', title:'25 Things Before 25 Launch', hook:'"I turn 25 in six months and I\'ve done approximately nothing with my twenties. Help."', phase:'Phase 1', pillar:'25 Before 25', length:'20-25s', structure:['Quick VO: turning 25 in January, want 25 new things','Funny examples: eat alone without pretending to be on a call','Ask: "Comment what I should add. Unhinged suggestions welcome."'], value:[], landing:null, status:'idea' },
  { id:'r6', title:'Things I\'ll Miss About This City I Said I Hated', hook:'"I spent two years saying I hated this city. Now that I\'m leaving, I can\'t stop noticing beautiful things about it."', phase:'Phase 1', pillar:'Reflections', length:'25-30s', structure:['Walking montage, reflective VO','Small things: sun on your street at 5pm, coffee shop that knows your order, quiet library corner'], value:[], landing:'"Maybe I didn\'t hate the city. Maybe I hated who I was in it."', status:'idea' },
  { id:'r7', title:'My Daily Routine in a City I\'m About to Leave', hook:'"Everything hits different when you know it\'s the last time."', phase:'Phase 1', pillar:'Independence', length:'25-30s', structure:['Day-in-the-life with awareness it\'s ending','Morning, coffee, gym, studying, walking — each beat has "last time" energy'], value:[], landing:'"I\'ve been doing this routine for months. In [X] days, none of it will exist anymore."', status:'idea' },
  { id:'r8', title:'I Left India 3 Years Ago — What Nobody Tells You', hook:'"I left India almost 3 years ago. Here\'s what nobody prepared me for."', phase:'Phase 1', pillar:'Immigrant', length:'30-35s', structure:['Montage of life in America — mundane, quiet'], value:['Loneliness doesn\'t hit Day 1. It hits Day 45.','You\'ll miss food more than people at first. Then the people hit hard.','You become a different version of yourself — can\'t fully go back.'], landing:'"I\'m not the girl who left India. But I\'m grateful she was brave enough to get on that plane."', status:'idea' },

// ===== STATE =====
let state = {
  reels: ALL_REELS.map(r => ({...r})),
  log: [],
  calEvents: [],
  ideas: [],
  currentMonth: new Date().getMonth(),
  currentYear: new Date().getFullYear(),
  activeFilter: 'All',
};

function loadState() {
  try {
    const saved = localStorage.getItem('contentCommandCenter');
    if (saved) {
      const parsed = JSON.parse(saved);
      // Merge saved reel statuses onto our master list
      if (parsed.reels) {
        parsed.reels.forEach(sr => {
          const match = state.reels.find(r => r.id === sr.id);
          if (match) match.status = sr.status;
        });
        // Add any custom reels
        parsed.reels.filter(sr => sr.id.startsWith('custom_')).forEach(sr => {
          if (!state.reels.find(r => r.id === sr.id)) state.reels.push(sr);
        });
      }
      if (parsed.log) state.log = parsed.log;
      if (parsed.calEvents) state.calEvents = parsed.calEvents;
      if (parsed.ideas) state.ideas = parsed.ideas;
      if (parsed.currentMonth !== undefined) state.currentMonth = parsed.currentMonth;
      if (parsed.currentYear !== undefined) state.currentYear = parsed.currentYear;
    }
  } catch(e) { console.log('No saved state'); }
}

function saveState() {
  try {
    localStorage.setItem('contentCommandCenter', JSON.stringify({
      reels: state.reels.map(r => ({ id: r.id, status: r.status })),
      log: state.log,
      calEvents: state.calEvents,
      ideas: state.ideas,
      currentMonth: state.currentMonth,
      currentYear: state.currentYear,
    }));
  } catch(e) { console.log('Save failed'); }
}

// ===== DASHBOARD =====
function renderDashboard() {
  const total = state.reels.length;
  const filmed = state.reels.filter(r => r.status === 'filmed').length;
  const edited = state.reels.filter(r => r.status === 'edited').length;
  const posted = state.reels.filter(r => r.status === 'posted').length;
  const reshoot = state.reels.filter(r => r.status === 'reshoot').length;
  const footage = state.log.length;

  document.getElementById('statsRow').innerHTML = `
    <div class="stat-card"><div class="stat-label">Total Ideas</div><div class="stat-value coral">${total}</div></div>
    <div class="stat-card"><div class="stat-label">Filmed</div><div class="stat-value gold">${filmed}</div></div>
    <div class="stat-card"><div class="stat-label">Edited</div><div class="stat-value" style="color:var(--blue)">${edited}</div></div>
    <div class="stat-card"><div class="stat-label">Posted</div><div class="stat-value green">${posted}</div></div>
    <div class="stat-card"><div class="stat-label">Need Reshoot</div><div class="stat-value" style="color:var(--red)">${reshoot}</div></div>
    <div class="stat-card"><div class="stat-label">Footage Clips</div><div class="stat-value purple">${footage}</div></div>
  `;

  // Upcoming events
  const today = new Date(); today.setHours(0,0,0,0);
  const week = new Date(today); week.setDate(week.getDate()+7);
  const upcoming = state.calEvents.filter(e => {
    const d = new Date(e.date); return d >= today && d <= week;
  }).sort((a,b) => new Date(a.date) - new Date(b.date));

  document.getElementById('upcomingEvents').innerHTML = upcoming.length === 0 ? '<p style="color:var(--text-3);font-size:13px;">No events in the next 7 days. Add some in the Calendar tab.</p>' : upcoming.map(e => `
    <div style="background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:10px 14px;margin-bottom:6px;display:flex;align-items:center;gap:12px;">
      <span class="cal-event ${e.type}" style="display:inline-block;">${e.type === 'shoot' ? '📹' : e.type === 'edit' ? '✂️' : e.type === 'upload' ? '📤' : '📋'} ${e.type}</span>
      <span style="font-size:13px;color:var(--text-2);min-width:80px;">${new Date(e.date+'T12:00:00').toLocaleDateString('en-US',{month:'short',day:'numeric'})}</span>
      <span style="font-size:13px;">${e.title}</span>
    </div>
  `).join('');

  // Recent log
  const recent = [...state.log].reverse().slice(0,5);
  document.getElementById('recentActivity').innerHTML = recent.length === 0 ? '<p style="color:var(--text-3);font-size:13px;">No footage logged yet. Start tracking in the Video Log tab.</p>' : recent.map(l => `
    <div style="background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:10px 14px;margin-bottom:6px;display:flex;align-items:center;gap:12px;">
      <span style="font-size:12px;color:var(--text-3);min-width:80px;">${l.date || 'No date'}</span>
      <span style="font-size:13px;flex:1;">${l.desc}</span>
      <span style="font-size:11px;padding:2px 8px;border-radius:10px;background:${l.status==='usable'?'var(--green-dim)':l.status==='reshoot'?'var(--red-dim)':'var(--gold-dim)'};color:${l.status==='usable'?'var(--green)':l.status==='reshoot'?'var(--red)':'var(--gold)'};">${l.status}</span>
    </div>
  `).join('');
}

// ===== CONTENT LIBRARY =====
const phases = ['All','Phase 1','Phase 2','Phase 3','Phase 4','Storytelling'];
const pillars = ['NYC Life','Independence','Career','25 Before 25','Reflections','Immigrant','Growth','Food'];

function renderFilterChips() {
  document.getElementById('filterChips').innerHTML = phases.map(p =>
    `<button class="filter-chip ${state.activeFilter===p?'active':''}" onclick="state.activeFilter='${p}';renderLibrary()">${p}</button>`
  ).join('');
}

  let reels = state.reels;
  if (state.activeFilter !== 'All') reels = reels.filter(r => r.phase === state.activeFilter);
  if (search) reels = reels.filter(r => r.title.toLowerCase().includes(search) || r.hook.toLowerCase().includes(search) || r.pillar.toLowerCase().includes(search));

  renderFilterChips();
  document.getElementById('reelGrid').innerHTML = reels.map(r => `
    <div class="reel-card" id="card-${r.id}" onclick="toggleCard('${r.id}')">
      <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:12px;">
        <div style="flex:1;">
          <div class="reel-title">${r.title}</div>
          <div class="reel-hook">${r.hook}</div>
          <div class="reel-meta">
            <span class="reel-tag tag-phase">${r.phase}</span>
            <span class="reel-tag tag-pillar">${r.pillar}</span>
            <span class="reel-tag tag-length">${r.length}</span>
            <span class="tag-status status-${r.status}">${r.status.toUpperCase()}</span>
          </div>
        </div>
      </div>
      <div class="reel-details" id="details-${r.id}">
        ${r.structure && r.structure.length ? `<div class="detail-section"><div class="detail-label">Structure / What to Film</div><ul class="detail-list">${r.structure.map(s=>`<li>${s}</li>`).join('')}</ul></div>` : ''}
        ${r.value && r.value.length ? `<div class="detail-section"><div class="detail-label">Value / Tips</div><ul class="detail-list">${r.value.map(v=>`<li>${v}</li>`).join('')}</ul></div>` : ''}
        ${r.landing ? `<div class="detail-section"><div class="detail-label">Landing Line</div><div class="detail-text" style="font-style:italic;border-left:3px solid var(--teal);padding-left:12px;">${r.landing}</div></div>` : ''}
        <div class="reel-actions">
          <button class="btn" onclick="event.stopPropagation();changeStatus('${r.id}','idea')">💡 Idea</button>
          <button class="btn" onclick="event.stopPropagation();changeStatus('${r.id}','filmed')">📷 Filmed</button>
          <button class="btn" onclick="event.stopPropagation();changeStatus('${r.id}','edited')">✂️ Edited</button>
          <button class="btn" onclick="event.stopPropagation();changeStatus('${r.id}','posted')">✅ Posted</button>

}

function toggleCard(id) {
  const card = document.getElementById('card-'+id);
  card.classList.toggle('expanded');
}

function changeStatus(id, status) {
  const reel = state.reels.find(r => r.id === id);
  if (reel) { reel.status = status; saveState(); renderLibrary(); renderDashboard(); }
}

// ===== VIDEO LOG =====

// ===== CALENDAR =====
function renderCalendar() {
  const year = state.currentYear, month = state.currentMonth;
  const monthNames = ['January','February','March','April','May','June','July','August','September','October','November','December'];
  document.getElementById('calMonth').textContent = `${monthNames[month]} ${year}`;

  const firstDay = new Date(year, month, 1).getDay();
  const daysInMonth = new Date(year, month+1, 0).getDate();
  const daysInPrev = new Date(year, month, 0).getDate();
  const today = new Date(); today.setHours(0,0,0,0);

  let html = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].map(d => `<div class="cal-day-label">${d}</div>`).join('');

  // Previous month fill
  for (let i = firstDay-1; i >= 0; i--) {
    const day = daysInPrev - i;
    html += `<div class="cal-cell other-month"><div class="cal-date">${day}</div></div>`;
  }

  // Current month
  for (let d = 1; d <= daysInMonth; d++) {
    const dateStr = `${year}-${String(month+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const cellDate = new Date(year, month, d);
    const isToday = cellDate.getTime() === today.getTime();
    const events = state.calEvents.filter(e => e.date === dateStr);

    html += `<div class="cal-cell ${isToday?'today':''}" onclick="openCalModal('${dateStr}')">
      <div class="cal-date">${d}</div>
      ${events.map(e => `<div class="cal-event ${e.type}" title="${e.title}${e.notes ? ': '+e.notes : ''}">${e.type==='shoot'?'📹':e.type==='edit'?'✂️':e.type==='upload'?'📤':'📋'} ${e.title}</div>`).join('')}
      <div class="cal-add">+ add</div>
    </div>`;
  }

  // Next month fill
  const totalCells = firstDay + daysInMonth;
  const remaining = (7 - totalCells % 7) % 7;
  for (let i = 1; i <= remaining; i++) {
    html += `<div class="cal-cell other-month"><div class="cal-date">${i}</div></div>`;
  }

  document.getElementById('calGrid').innerHTML = html;
}

function changeMonth(dir) {
  state.currentMonth += dir;
  if (state.currentMonth > 11) { state.currentMonth = 0; state.currentYear++; }
  if (state.currentMonth < 0) { state.currentMonth = 11; state.currentYear--; }
  saveState(); renderCalendar();
}

function openCalModal(dateStr) {
  document.getElementById('calModal').classList.add('open');
  if (dateStr) document.getElementById('calEventDate').value = dateStr;
  else document.getElementById('calEventDate').value = new Date().toISOString().split('T')[0];
}
function closeCalModal() { document.getElementById('calModal').classList.remove('open'); }
function saveCalEvent() {
  const title = document.getElementById('calEventTitle').value;
  if (!title) return;
  state.calEvents.push({
    date: document.getElementById('calEventDate').value,
    title,
    type: document.getElementById('calEventType').value,
    notes: document.getElementById('calEventNotes').value,
  });
  saveState(); closeCalModal(); renderCalendar(); renderDashboard();
  document.getElementById('calEventTitle').value = '';
  document.getElementById('calEventNotes').value = '';
}

// ===== IDEA BANK =====
function renderIdeas() {
  const catColors = { 'NYC Life':['var(--coral-dim)','var(--coral)'], 'Independence':['var(--teal-dim)','var(--teal)'], 'Career':['var(--blue-dim)','var(--blue)'], 'Food':['var(--gold-dim)','var(--gold)'], 'Immigrant':['var(--purple-dim)','var(--purple)'], 'Growth':['var(--green-dim)','var(--green)'], 'Funny':['var(--pink-dim)','var(--pink)'], 'Other':['var(--surface-3)','var(--text-3)'] };

  document.getElementById('ideaList').innerHTML = state.ideas.length === 0 ? '<p style="color:var(--text-3);font-size:13px;padding:20px 0;">No ideas saved yet. Type one above and hit Enter or click Add.</p>' : state.ideas.map((idea,i) => {
    const [bg,fg] = catColors[idea.category] || catColors['Other'];
    return `<div class="idea-card">
      <div style="flex:1;">
        <div class="idea-text">${idea.text}</div>
        <span class="idea-pill" style="background:${bg};color:${fg};">${idea.category}</span>
      </div>
      <div class="idea-actions">
        <button class="idea-promote" onclick="promoteIdea(${i})" title="Promote to reel idea">↗ Promote</button>
        <button class="idea-delete" onclick="deleteIdea(${i})">&times;</button>
      </div>
    </div>`;
  }).join('');
}

function addIdea() {
  const text = document.getElementById('newIdeaInput').value.trim();
  if (!text) return;
  const category = document.getElementById('newIdeaCategory').value;
  state.ideas.push({ text, category, created: new Date().toISOString() });
  saveState(); renderIdeas();
  document.getElementById('newIdeaInput').value = '';
}

function deleteIdea(i) { state.ideas.splice(i,1); saveState(); renderIdeas(); }

function promoteIdea(i) {
  const idea = state.ideas[i];
  const newReel = {
    id: 'custom_' + Date.now(),
    title: idea.text.substring(0,60),
    hook: '"' + idea.text + '"',
    phase: 'Phase 4',
    pillar: idea.category === 'Funny' ? 'Growth' : idea.category,
    length: '20-30s',
    structure: [],
    value: [],
    landing: null,
    status: 'idea',
  };
  state.reels.push(newReel);
  state.ideas.splice(i,1);
  saveState(); renderIdeas(); renderLibrary(); renderDashboard();
}

// ===== EXPORT/IMPORT =====
function exportData() {
  const data = JSON.stringify({ reels: state.reels.map(r => ({id:r.id,status:r.status})), log: state.log, calEvents: state.calEvents, ideas: state.ideas }, null, 2);
  const blob = new Blob([data], { type:'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'content_command_center_backup.json';
  a.click();
}

function importDataPrompt() { document.getElementById('importFile').click(); }
function importData(e) {
  const file = e.target.files[0]; if (!file) return;
  const reader = new FileReader();
  reader.onload = function(ev) {
    try {
      const data = JSON.parse(ev.target.result);
      if (data.reels) data.reels.forEach(sr => { const m = state.reels.find(r=>r.id===sr.id); if(m) m.status=sr.status; });
      if (data.log) state.log = data.log;
      if (data.calEvents) state.calEvents = data.calEvents;
      if (data.ideas) state.ideas = data.ideas;
      saveState(); renderAll();
      alert('Data imported successfully!');
    } catch(err) { alert('Invalid file.'); }
  };
  reader.readAsText(file);
}

// ===== INIT =====
function renderAll() { renderDashboard(); renderLibrary(); renderLog(); renderCalendar(); renderIdeas(); }
loadState();
renderAll();
